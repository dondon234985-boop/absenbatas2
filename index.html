<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Absensi Pro - GAS WebMaster</title>
  
  <!-- CSS & JS Peta (Leaflet) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- UI Framework (Bootstrap 5) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- AI Library (Face-API.js) -->
  <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
  
  <style>
    body { background: #f0f2f5; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .main-container { max-width: 500px; margin: auto; padding: 15px; }
    #video-container { position: relative; width: 100%; border-radius: 20px; overflow: hidden; background: #000; box-shadow: 0 10px 30px rgba(0,0,0,0.2); line-height: 0; }
    video { width: 100%; height: auto; display: block; }
    .nav-pills .nav-link { border-radius: 10px; font-weight: bold; font-size: 0.8rem; background: #fff; margin: 0 2px; border: 1px solid #ddd; color: #666; }
    .nav-pills .nav-link.active { background-color: #0d6efd; color: white; border-color: #0d6efd; }
    .page-section { display: none; }
    .active-page { display: block; }
    .btn-custom { padding: 12px; font-weight: bold; border-radius: 12px; transition: 0.3s; }
    #map { height: 250px; width: 100%; border-radius: 15px; margin-bottom: 15px; border: 1px solid #ddd; z-index: 1; }
    .table-responsive { font-size: 0.7rem; border-radius: 12px; }
    .badge-status { font-size: 0.85rem; padding: 8px 15px; }
  </style>
</head>
<body>

<div class="main-container">
  <!-- Navigasi Menu -->
  <ul class="nav nav-pills nav-justified mb-3 p-1 bg-white rounded-4 shadow-sm">
    <li class="nav-item"><a class="nav-link active" href="#" onclick="showPage('absen-page', this)">Absen</a></li>
    <li class="nav-item"><a class="nav-link" href="#" onclick="showPage('riwayat-page', this)">Riwayat</a></li>
    <li class="nav-item"><a class="nav-link" href="#" onclick="showPage('daftar-page', this)">Daftar</a></li>
    <li class="nav-item"><a class="nav-link" href="#" onclick="showPage('admin-page', this)">Admin</a></li>
  </ul>

  <!-- Bagian Kamera -->
  <div id="cam-section">
    <div id="video-container" class="mb-3">
      <video id="video" autoplay muted playsinline></video>
    </div>
    <div class="text-center mb-4">
      <span id="status" class="badge-status badge rounded-pill bg-secondary text-white shadow-sm">Inisialisasi AI...</span>
    </div>
  </div>

  <!-- HALAMAN 1: ABSEN -->
  <div id="absen-page" class="page-section active-page">
    <div class="row g-2">
      <div class="col-6">
        <button id="btnMasuk" class="btn btn-success btn-custom w-100 shadow-sm" onclick="processAbsence('MASUK')" disabled>ABSEN MASUK</button>
      </div>
      <div class="col-6">
        <button id="btnPulang" class="btn btn-danger btn-custom w-100 shadow-sm" onclick="processAbsence('PULANG')" disabled>ABSEN PULANG</button>
      </div>
    </div>
  </div>

  <!-- HALAMAN 2: RIWAYAT -->
  <div id="riwayat-page" class="page-section">
    <div class="card border-0 shadow-sm p-2 rounded-4">
      <div class="table-responsive">
        <table class="table table-sm table-striped mb-0">
          <thead class="table-dark">
            <tr><th>Nama</th><th>Divisi</th><th>Tipe</th><th>Waktu</th><th>Min</th><th>Map</th></tr>
          </thead>
          <tbody id="logTableBody">
            <tr><td colspan="6" class="text-center text-muted">Memuat riwayat...</td></tr>
          </tbody>
        </table>
      </div>
      <button class="btn btn-sm btn-outline-primary w-100 mt-2" onclick="loadLogs()">Refresh Data</button>
    </div>
  </div>

  <!-- HALAMAN 3: DAFTAR -->
  <div id="daftar-page" class="page-section">
    <div class="card border-0 shadow-sm p-4 rounded-4">
      <h6 class="fw-bold mb-3 text-center">Registrasi Karyawan Baru</h6>
      <input type="text" id="regNama" class="form-control mb-2" placeholder="Nama Lengkap">
      <input type="text" id="regNIK" class="form-control mb-2" placeholder="NIK">
      <input type="text" id="regDivisi" class="form-control mb-3" placeholder="Divisi (IT / HRD / Sales)">
      <button id="btnReg" class="btn btn-primary btn-custom w-100 shadow-sm" onclick="register()">SIMPAN WAJAH</button>
    </div>
  </div>

  <!-- HALAMAN 4: ADMIN -->
  <div id="admin-page" class="page-section">
    <div class="card border-0 shadow-sm p-4 rounded-4">
      <div id="admin-auth">
        <h6 class="fw-bold mb-3 text-center">Login Admin</h6>
        <input type="password" id="adminPin" class="form-control mb-2" placeholder="Masukkan PIN Admin">
        <button class="btn btn-dark w-100" onclick="authAdmin()">Buka Panel</button>
      </div>
      <div id="admin-content" style="display:none;">
        <h6 class="fw-bold mb-2">Tandai Lokasi di Peta:</h6>
        <div id="map"></div>
        <input type="text" id="offName" class="form-control mb-2" placeholder="Nama Cabang/Kantor">
        <div class="row g-2 mb-2">
          <div class="col-6"><input type="text" id="offLat" class="form-control" placeholder="Lat" readonly></div>
          <div class="col-6"><input type="text" id="offLon" class="form-control" placeholder="Lon" readonly></div>
        </div>
        <input type="number" id="offRad" class="form-control mb-3" placeholder="Radius (Meter) misal: 50">
        <button class="btn btn-primary w-100 shadow-sm" onclick="addOffice()">SIMPAN LOKASI KANTOR</button>
      </div>
    </div>
  </div>

  <p class="text-center mt-5 text-muted" style="font-size: 10px;">GAS-WebMaster System v6.0</p>
</div>

<script>
  // PENTING: Ganti dengan URL /exec milik Anda!
  const GAS_URL = "https://script.google.com/macros/s/AKfycbwkDn1aJG67DAOs7cAi3i-e2b5oWQs1p1zzrlcWtyW8YypvhS6i4zC_OGCZ-aOFCvhE0A/exec"; 
  
  let labeledDescriptors = [], officeLocations = [];
  let map, adminMarker;
  const video = document.getElementById('video'), status = document.getElementById('status');
  const btnMasuk = document.getElementById('btnMasuk'), btnPulang = document.getElementById('btnPulang');

  // 1. Fungsi Navigasi
  function showPage(pId, el) {
    document.querySelectorAll('.page-section').forEach(p => p.classList.remove('active-page'));
    document.getElementById(pId).classList.add('active-page');
    document.querySelectorAll('.nav-link').forEach(n => n.classList.remove('active'));
    el.classList.add('active');
    
    // Tampilkan/Sembunyikan kamera
    document.getElementById('cam-section').style.display = (pId === 'riwayat-page' || pId === 'admin-page') ? 'none' : 'block';
    
    if(pId === 'riwayat-page') loadLogs();
    if(pId === 'admin-page') initAdminMap();
  }

  // 2. Inisialisasi Peta Admin
  function initAdminMap() {
    if (map) return;
    map = L.map('map').setView([-6.2000, 106.8166], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(map);
    map.on('click', function(e) {
      const { lat, lng } = e.latlng;
      if (adminMarker) { adminMarker.setLatLng(e.latlng); } else { adminMarker = L.marker(e.latlng).addTo(map); }
      document.getElementById('offLat').value = lat.toFixed(6);
      document.getElementById('offLon').value = lng.toFixed(6);
    });
    navigator.geolocation.getCurrentPosition(p => map.setView([p.coords.latitude, p.coords.longitude], 17));
  }

  // 3. Inisialisasi AI & Kamera
  async function init() {
    const MODEL_URL = 'https://raw.githubusercontent.com/justadudewhohacks/face-api.js/master/weights';
    try {
      updateStatus("MEMUAT MODEL...", "warning");
      await Promise.all([
        faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
        faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
        faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
      ]);
      
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
      video.srcObject = stream;

      updateStatus("SINKRON DATA...", "info");
      const [resF, resO] = await Promise.all([
        fetch(GAS_URL, {method:"POST", body:JSON.stringify({action:"getFaces"})}).then(r=>r.json()),
        fetch(GAS_URL, {method:"POST", body:JSON.stringify({action:"getOffices"})}).then(r=>r.json())
      ]);

      if (Array.isArray(resF)) {
        labeledDescriptors = resF.map(d => new faceapi.LabeledFaceDescriptors(d.name, [new Float32Array(d.descriptor)]));
      }
      officeLocations = resO;
      
      checkLocation();
    } catch (e) { updateStatus("ERROR SISTEM", "danger"); console.error(e); }
  }

  // 4. Logika Jarak (Geofencing)
  function getDistance(lat1, lon1, lat2, lon2) {
    const R = 6371000;
    const dLat = (lat2-lat1)*Math.PI/180, dLon = (lon2-lon1)*Math.PI/180;
    const a = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)*Math.sin(dLon/2);
    return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
  }

  function checkLocation() {
    navigator.geolocation.getCurrentPosition(pos => {
      const uLat = pos.coords.latitude, uLon = pos.coords.longitude;
      let found = officeLocations.find(o => getDistance(uLat, uLon, o.lat, o.lon) <= o.rad);
      if(found) { 
        updateStatus("LOKASI: " + found.name, "success"); 
        btnMasuk.disabled = false; btnPulang.disabled = false; 
      } else { 
        updateStatus("DI LUAR RADIUS", "danger"); 
        if(officeLocations.length > 0) alert("Anda berada di luar area kantor!");
      }
    }, () => alert("GPS Mati! Harap aktifkan lokasi."), {enableHighAccuracy:true});
  }

  // 5. Proses Absensi
  async function processAbsence(tipe) {
    if(labeledDescriptors.length === 0) return alert("Database wajah kosong!");
    btnMasuk.disabled = true; btnPulang.disabled = true; 
    updateStatus("MENGENALI...", "warning");

    try {
      const d = await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions()).withFaceLandmarks().withFaceDescriptor();
      if(!d) { alert("Wajah tidak terlihat jelas!"); resetUI(); return; }
      
      const match = new faceapi.FaceMatcher(labeledDescriptors, 0.6).findBestMatch(d.descriptor);
      if(match.label === 'unknown') { alert("Wajah tidak terdaftar!"); resetUI(); }
      else {
        navigator.geolocation.getCurrentPosition(async p => {
          updateStatus("MENYIMPAN...", "info");
          const res = await fetch(GAS_URL, {
            method: "POST", 
            body: JSON.stringify({action:"attendance", name:match.label, type:tipe, location: p.coords.latitude + "," + p.coords.longitude})
          }).then(r=>r.json());
          alert(`✅ ${res.message}\nNama: ${match.label}`);
          resetUI();
        });
      }
    } catch (e) { alert("Gagal koneksi!"); resetUI(); }
  }

  // 6. Muat Riwayat
  async function loadLogs() {
    const b = document.getElementById('logTableBody');
    b.innerHTML = '<tr><td colspan="6">Memuat data...</td></tr>';
    try {
      const res = await fetch(GAS_URL, {method:"POST", body:JSON.stringify({action:"getLogs"})}).then(r=>r.json());
      // format server: [Nama, Divisi, Tipe, Waktu, Durasi, Lokasi]
      b.innerHTML = res.slice(1).map(l => `
        <tr>
          <td class="fw-bold">${l[0]}</td>
          <td>${l[1] || '-'}</td>
          <td><span class="badge ${l[2]=='MASUK'?'bg-success':'bg-danger'}">${l[2]}</span></td>
          <td>${l[3]}</td>
          <td>${l[4] || '-'}</td>
          <td><a href="https://www.google.com/maps?q=${l[5]}" target="_blank">Map</a></td>
        </tr>
      `).join('');
    } catch (e) { b.innerHTML = '<tr><td colspan="6">Gagal memuat.</td></tr>'; }
  }

  // 7. Panel Admin & Registrasi
  function authAdmin() { if(document.getElementById('adminPin').value === "123456") { document.getElementById('admin-auth').style.display='none'; document.getElementById('admin-content').style.display='block'; setTimeout(()=>map.invalidateSize(), 400); } else alert("PIN Salah!"); }
  
  async function addOffice() {
    const d = { name: document.getElementById('offName').value, lat: document.getElementById('offLat').value, lon: document.getElementById('offLon').value, rad: document.getElementById('offRad').value };
    if(!d.lat || !d.name) return alert("Lengkapi data dan pilih map!");
    const res = await fetch(GAS_URL,{method:"POST", body:JSON.stringify({action:"saveOffice", pin:document.getElementById('adminPin').value, data:d})}).then(r=>r.json());
    alert(res.message); location.reload();
  }

  async function register() {
    const n = document.getElementById('regNama').value, ni = document.getElementById('regNIK').value, dv = document.getElementById('regDivisi').value;
    if(!n || !ni || !dv) return alert("Lengkapi data!");
    updateStatus("MEREKAM...", "warning");
    const d = await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions()).withFaceLandmarks().withFaceDescriptor();
    if(d) {
      const res = await fetch(GAS_URL, {method:"POST", body:JSON.stringify({action: "register", name: n, nik: ni, divisi: dv, descriptor: Array.from(d.descriptor)})}).then(r=>r.json());
      alert(res.message); location.reload();
    } else alert("Wajah gagal terekam!");
  }

  function resetUI() { btnMasuk.disabled = false; btnPulang.disabled = false; updateStatus("SISTEM SIAP","success"); }
  function updateStatus(t,c) { status.innerText = t; status.className = "badge-status badge rounded-pill bg-"+c+" px-3 py-2 text-white shadow-sm"; }
  
  window.onload = init;
</script>
</body>
</html>
